services:
  # ------------------------------------------------------------
  # DIFY
  # ------------------------------------------------------------
  dify-nginx:
    <<: *service-common-ref
    # image-ref: library/nginx:1.27.1-alpine
    image: registry.cloudvalley.site:4/library/nginx:1.27.1-alpine
    environment:
      <<: [*env-common-ref, *env-proxy-ref]
    volumes:
      - nfs_dify_nginx:/etc/nginx
    logging:
      driver: fluentd
      options:
        tag: docker.ai.dify-nginx
        fluentd-async-connect: "true"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.dify.rule=Host(`dify.${DOMAIN_SWARM}`,`dify.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.dify.entrypoints=websecure
        - traefik.http.routers.dify.service=dify
        # - traefik.http.routers.dify.middlewares=auth,normal-chain@file
        - traefik.http.services.dify.loadbalancer.server.port=80
        - homepage.group=AI & Automation
        - homepage.name=Dify API
        - homepage.icon=dify.png
        - homepage.href=https://dify.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=AI 
        - homepage.siteMonitor=http://dify-web:3000
        - homepage.weight=10
      <<: [*deploy-common-ref, *placement-default-ref]

  dify-api:
    <<: *service-common-ref
    # image-ref: langgenius/dify-api:0.7.1
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/langgenius/dify-api:0.7.1
    environment:
      <<: [*env-common-ref, *env-proxy-ref, *env-dify-shared-api-worker-ref]
      MODE: api
    volumes:
      - nfs_dify_storage:/app/api/storage
    logging:
      driver: fluentd
      options:
        tag: docker.ai.dify-api
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref]

  dify-worker:
    <<: *service-common-ref
    # image-ref: langgenius/dify-api:0.7.1
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/langgenius/dify-api:0.7.1
    environment:
      <<: [*env-common-ref, *env-proxy-ref, *env-dify-shared-api-worker-ref]
      MODE: worker
    volumes:
      - nfs_dify_storage:/app/api/storage
    logging:
      driver: fluentd
      options:
        tag: docker.ai.dify-work
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref]

  dify-web:
    <<: *service-common-ref
    # image-ref: langgenius/dify-web:0.7.1
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/langgenius/dify-web:0.7.1
    environment:
      <<: [*env-common-ref, *env-proxy-ref]
      CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL:-}
      APP_API_URL: ${DIFY_APP_API_URL:-}
      SENTRY_DSN: ${DIFY_WEB_SENTRY_DSN:-}
      NEXT_TELEMETRY_DISABLED: ${DIFY_NEXT_TELEMETRY_DISABLED:-0}
    logging:
      driver: fluentd
      options:
        tag: docker.ai.dify-web
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref]

  dify-sandbox:
    <<: *service-common-ref
    # image-ref: langgenius/dify-sandbox:0.2.6
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/langgenius/dify-sandbox:0.2.6
    environment:
      <<: [*env-common-ref, *env-proxy-ref]
      API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: ${DIFY_SANDBOX_GIN_MODE:-release}
      WORKER_TIMEOUT: ${DIFY_SANDBOX_WORKER_TIMEOUT:-15}
      ENABLE_NETWORK: ${DIFY_SANDBOX_ENABLE_NETWORK:-true}
      HTTP_PROXY: ${DIFY_SANDBOX_HTTP_PROXY:-http://ssrf_proxy:3128}
      HTTPS_PROXY: ${DIFY_SANDBOX_HTTPS_PROXY:-http://ssrf_proxy:3128}
      SANDBOX_PORT: ${DIFY_SANDBOX_PORT:-8194}
    volumes:
      - nfs_dify_sandbox:/dependencies
    logging:
      driver: fluentd
      options:
        tag: docker.ai.dify-sandbox
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref]

  ssrf_proxy:
    <<: *service-common-ref
    # image-ref: ubuntu/squid:6.6-24.04_beta
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/ubuntu/squid:6.6-24.04_beta
    entrypoint: [ "sh", "-c", "cp /etc/squid/docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh" ]
    environment:
      <<: [*env-common-ref, *env-proxy-ref]
      HTTP_PORT: ${DIFY_SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${DIFY_SSRF_COREDUMP_DIR:-/var/spool/squid}
      REVERSE_PROXY_PORT: ${DIFY_SSRF_REVERSE_PROXY_PORT:-8194}
      SANDBOX_HOST: ${DIFY_SSRF_SANDBOX_HOST:-sandbox}
      SANDBOX_PORT: ${DIFY_SANDBOX_PORT:-8194}
    volumes:
      - nfs_dify_ssrf:/etc/squid
    logging:
      driver: fluentd
      options:
        tag: docker.ai.ssrf_proxy
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref]

  # ------------------------------------------------------------
  # Flowise
  # ------------------------------------------------------------
  flowise:
    <<: *service-common-ref
    # image-ref: flowiseai/flowise:2.1.1
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/flowiseai/flowise:2.1.1
    entrypoint: /bin/sh -c "sleep 3; flowise start"
    environment:
      <<: [*env-common-ref, *env-proxy-ref]
      PORT: ${FLOWISE_PORT}
      CORS_ORIGINS: ${FLOWISE_CORS_ORIGINS}
      IFRAME_ORIGINS: ${FLOWISE_IFRAME_ORIGINS}
      FLOWISE_USERNAME: ${FLOWISE_FLOWISE_USERNAME}
      FLOWISE_PASSWORD: ${FLOWISE_FLOWISE_PASSWORD}
      FLOWISE_FILE_SIZE_LIMIT: ${FLOWISE_FLOWISE_FILE_SIZE_LIMIT}
      DEBUG: ${FLOWISE_DEBUG}
      DATABASE_PATH: ${FLOWISE_DATABASE_PATH}
      DATABASE_TYPE: ${FLOWISE_DATABASE_TYPE}
      DATABASE_PORT: ${FLOWISE_DATABASE_PORT}
      DATABASE_HOST: ${FLOWISE_DATABASE_HOST}
      DATABASE_NAME: ${FLOWISE_DATABASE_NAME}
      DATABASE_USER: ${FLOWISE_DATABASE_USER}
      DATABASE_PASSWORD: ${FLOWISE_DATABASE_PASSWORD}
      DATABASE_SSL: ${FLOWISE_DATABASE_SSL}
      DATABASE_SSL_KEY_BASE64: ${FLOWISE_DATABASE_SSL_KEY_BASE64}
      APIKEY_PATH: ${FLOWISE_APIKEY_PATH}
      SECRETKEY_PATH: ${FLOWISE_SECRETKEY_PATH}
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_FLOWISE_SECRETKEY_OVERWRITE}
      LOG_LEVEL: ${FLOWISE_LOG_LEVEL}
      LOG_PATH: ${FLOWISE_LOG_PATH}
      BLOB_STORAGE_PATH: ${FLOWISE_BLOB_STORAGE_PATH}
      DISABLE_FLOWISE_TELEMETRY: ${FLOWISE_DISABLE_FLOWISE_TELEMETRY}
      MODEL_LIST_CONFIG_JSON: ${FLOWISE_MODEL_LIST_CONFIG_JSON}
    volumes:
      - nfs_flowise_data:/root/.flowise
    logging:
      driver: fluentd
      options:
        tag: docker.ai.flowise
        fluentd-async-connect: "true"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.flowise.rule=Host(`flowise.${DOMAIN_SWARM}`,`flowise.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.flowise.entrypoints=websecure
